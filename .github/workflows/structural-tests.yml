name: Caddr structural tests

on:
  push:
    branches:
      - master
      - caddr-workspace-integration
  pull_request:
    branches:
      - master
      - caddr-workspace-integration

jobs:
  structural-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install structural analysis dependency
        run: python -m pip install -r requirements.txt
      - name: Run structural analysis regression tests
        run: python -m unittest discover -s tests -v
      - name: Run CAD core regression tests
        run: node --test tests/core.test.js
      - name: Run column-recognition regression tests
        run: node --test tests/column-detection.test.js
      - name: Check front-end JavaScript syntax
        run: |
          node --check core.js
          node --check app.js
          node --check dashboard.js
          node --check structural.js
          node --check workspace-ui.js
